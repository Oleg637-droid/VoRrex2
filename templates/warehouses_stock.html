<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Warehouse — Складской учет</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Модальное окно добавления товара -->
    <div class="modal-overlay" id="addProductModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Добавить новый товар</h3>
                <button type="button" class="modal-close-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="addProductForm">
                <div class="form-group">
                    <label class="form-label" for="productTitle">Наименование товара / артикул</label>
                    <input type="text" class="form-control" id="productTitle" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="form-label" for="productCategory">Категория</label>
                    <input type="text" class="form-control" id="productCategory" value="Гидравлика/Фитинги" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="form-label" for="productPrice">Цена</label>
                    <input type="number" step="0.01" class="form-control" id="productPrice" value="0" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="productWarehouse">Склад / Расположение</label>
                    <select class="form-select" id="productWarehouse">
                        <option value="Склад 1">Основной склад (Склад 1)</option>
                        <option value="Склад 2">Филиал (Склад 2)</option>
                        <option value="Склад 3">Резерв (Склад 3)</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="cancelModalBtn">Отмена</button>
                    <button type="submit" class="btn-primary">Сохранить товар</button>
                </div>
            </form>
        </div>
    </div>

    <div class="app-container">
        <header class="app-header">
            <div class="logo-area">
                <a href="/database.html" class="back-btn" title="На главную хаба">←</a>
                <span class="logo-icon">🏢</span>
                <h1>Складской<span>Учет</span></h1>
            </div>
            <div class="header-badge">База данных PostgreSQL</div>
        </header>

        <main class="warehouse-workspace">
            <div class="control-panel">
                <div class="warehouse-tabs" id="warehouseTabs">
                    <button type="button" class="wh-tab active" data-warehouse="all">Все склады</button>
                    <button type="button" class="wh-tab" data-warehouse="1">Склад №1 (Основной)</button>
                    <button type="button" class="wh-tab" data-warehouse="2">Склад №2 (Филиал)</button>
                    <button type="button" class="wh-tab" data-warehouse="3">Склад №3 (Резерв)</button>
                </div>
                
                <div style="display: flex; gap: 12px; align-items: center;">
                    <button type="button" class="btn-add-product" id="openModalBtn">
                        <span>＋</span> Добавить товар
                    </button>
                    <div class="search-box wh-search">
                        <span class="search-ico">🔍</span>
                        <input type="text" id="stockSearchInput" placeholder="Поиск по артикулу или названию..." autocomplete="off">
                    </div>
                </div>
            </div>

            <div class="stock-table-card">
                <div class="table-responsive">
                    <table class="modern-table">
                        <thead>
                            <tr>
                                <th>Артикул / Наименование</th>
                                <th>Категория</th>
                                <th>Склад №1</th>
                                <th>Склад №2</th>
                                <th>Склад №3</th>
                                <th>Общий остаток</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="stockTableBody">
                            <!-- Данные загружаются динамически из БД через JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/warehouses_stock.js"></script>
</body>
</html>
